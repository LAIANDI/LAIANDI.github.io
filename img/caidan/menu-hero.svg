<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e0fa"/>
      <stop offset=".42" stop-color="#e9f7ff"/>
      <stop offset=".72" stop-color="#fff7ec"/>
      <stop offset="1" stop-color="#ffe7d2"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe3b0" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffd79b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd79b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffd9c0" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="cloud2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffd9c6" stop-opacity=".95"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#sky)"/>
  <circle cx="1290" cy="70" r="210" fill="url(#sun)"/>

  <g fill="#ffffff" opacity=".35" filter="url(#soft2)">
    <ellipse cx="220" cy="120" rx="220" ry="46"/>
    <ellipse cx="520" cy="70" rx="180" ry="32"/>
    <ellipse cx="1440" cy="180" rx="240" ry="40"/>
  </g>

  <g filter="url(#soft)">
    <g fill="url(#cloud)">
      <ellipse cx="120" cy="520" rx="260" ry="110"/>
      <ellipse cx="360" cy="545" rx="210" ry="90"/>
      <ellipse cx="1480" cy="540" rx="240" ry="120"/>
      <ellipse cx="1210" cy="560" rx="220" ry="90"/>
      <ellipse cx="760" cy="590" rx="260" ry="80"/>
    </g>
    <g fill="url(#cloud2)" opacity=".85">
      <ellipse cx="880" cy="560" rx="180" ry="70"/>
      <ellipse cx="1040" cy="580" rx="160" ry="60"/>
    </g>
  </g>

  <g fill="none" stroke="#49b1f5" stroke-opacity=".18">
    <circle cx="70" cy="40" r="150" stroke-width="18"/>
    <circle cx="70" cy="40" r="205" stroke-width="10" stroke-opacity=".12"/>
  </g>
  <g fill="none" stroke="#00c4b6" stroke-opacity=".14">
    <circle cx="1560" cy="500" r="170" stroke-width="20"/>
  </g>

  <g fill="none" stroke="#7fa9c4" stroke-opacity=".45" stroke-width="3" stroke-linecap="round">
    <path d="M300 170 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M370 205 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M255 225 q7 -7 14 0 q7 -7 14 0"/>
  </g>

  <g fill="#ffffff" opacity=".8">
    <circle cx="520" cy="150" r="3"/>
    <circle cx="980" cy="120" r="2.5"/>
    <circle cx="1120" cy="200" r="2"/>
    <circle cx="760" cy="230" r="2.5"/>
    <circle cx="1400" cy="300" r="3"/>
  </g>
</svg>

